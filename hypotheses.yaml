hypotheses:
  H1:
    nome: "Emergência da Dimensão Espectral no Dirac Puro (GUE)"
    descricao: "A dinâmica do Heat Kernel em grande escala no operador de Dirac puramente aleatório GUE produz d_spec ≈ 4."
    predicao: "d_spec(t) apresenta plateau estável com R^2 > 0.99 e d_spec ≈ 4.0."
    teste: "Regressão linear deslizante de log P(t) vs log t no operador D puro."
    criterio_sucesso: "Plateau estável com d_spec entre 3.8 e 4.2 e R^2 > 0.99."
    criterio_falha: "d_spec convergindo para o regime de Wigner ~ 1.0 a 1.15."
    status: "FAILED"
    motivo_falha: "Universalidade da densidade de semicírculo de Wigner em matrizes hermitianas puras resulta analiticamente em d_spec = 1.0."

  H1_1_NEXT:
    nome: "Dimensão Espectral em Geometrias de Produto Não-Comutativo"
    descricao: "Um operador de Dirac estruturado por produto tensorial de geometrias espectrais D_total = D_1 (x) I + gamma_1 (x) D_2 produz dimensão aditiva d_total = d_1 + d_2 = 4."
    predicao: "O Heat Trace do produto tensorial satisfaz P_total(t) = P_1(t) * P_2(t) resultando em d_spec = 4 a partir de blocos 1D/2D fundamentais."
    teste: "Construção de produto de triplas espectrais e cálculo de d_spec via regressão linear deslizante de log P_total(t) vs log t."
    criterio_sucesso:
      - "Plateau estável com d_spec entre 3.8 e 4.2 e R^2 > 0.99"
      - "Independência de semente e estabilidade sob escala N"
      - "Sem inserção de perda ou calibração dirigida"
    criterio_falha:
      - "d_spec desviando significativamente de 4.0"
      - "Colapso do Heat Trace em ruído numérico ou saturação prematura"
    status: "PROPOSED / UNTESTED"

  H2:
    nome: "Emergência de Assinatura Causal Lorentziana via Krein Estocástico"
    descricao: "A imposição de uma simetria fundamental de Krein eta sobre D produz espontaneamente assinatura (1,3)."
    predicao: "G_eff produz assinatura macroscópica (1,3) ou (3,1) estável sem inserção manual de eta."
    teste: "Diagonalização real de G_eff em múltiplos N e seeds, varredura de eta e modelos nulos."
    criterio_sucesso: "Assinatura (1,3) estável e P((1,3)|TGE) > 0.95."
    criterio_falha: "P((1,3)|TGE) = 0.0, dependência direta de eta ou colapso euclidiano quando eta=I."
    status: "FAILED"
    motivo_falha: "A indefinição é 100% herdada de eta (teste eta=I colapsa em (128,0,0)) e G_eff distribui múltiplos autovalores negativos (ex: (121,7,0)), sem selecionar a direção temporal única 1+3."

  H2_1_NEXT:
    nome: "Assinatura Lorentziana via Módulo de Clifford e Estrutura Real de Connes-Barrett"
    descricao: "A álgebra de Clifford Cl(1,3) com relações de KO-dimensão (J^2 = -1, JD = DJ, J_gamma = -gamma_J) seleciona algebricamente a assinatura Lorentziana 1+3 no fibrado de espinores."
    predicao: "A forma bilinear graduada por J e gamma_5 induz exatamente 1 gerador temporal e 3 espaciais na representação irredutível de espinores."
    teste: "Implementação da tripla espectral real de Barrett com geradores de Clifford gamma^mu e diagonalização dos operadores graduados."
    criterio_sucesso:
      - "Assinatura metricial (1,3) ou (3,1) invariante sob transformações de calibre unitárias"
      - "Sem necessidade de matriz de Krein eta externa ad-hoc"
      - "Diferença estatística estrita contra matrizes aleatórias GUE"
    criterio_falha:
      - "Falha na representação das relações de KO-dimensão"
      - "Presença de múltiplos autovalores temporais não-físicos"
      - "Colapso em assinatura puramente Euclidiana"
    status: "PROPOSED / UNTESTED"

  H3:
    nome: "Quebra de Degenerescência por Geometria Interna"
    descricao: "A álgebra interna não-comutativa quebra a degenerescência dos autovalores do Laplaciano espectral."
    predicao: "Espaçamento de autovalores não nulo no setor de baixa energia."
    teste: "Cálculo da estatística de espaçamento de autovalores vizinhos (Level Spacing Distribution)."
    criterio_sucesso: "Distribuição de espaçamento Wigner-Dyson (GOE/GUE) indicando caos quântico e quebra de degenerescência."
    criterio_falha: "Distribuição de Poisson pura indicando ausência de acoplamento geométrico interno."
    status: "UNTESTED"

  H4:
    nome: "Hierarquia de Massas Leptônicas via Seesaw Espectral"
    descricao: "O mecanismo de Seesaw emergente produz massas de neutrinos na escala sub-eV a partir da escala Majorana."
    predicao: "m_nu ~ m_D^2 / M_R < 1 eV."
    teste: "Derivação sem utilização de massas de neutrinos de entrada na matriz geradora."
    criterio_sucesso: "Massas leves na faixa de 0.001 eV a 0.1 eV sem ajuste contínuo de parâmetros."
    criterio_falha: "Necessidade de ajuste fino (fine-tuning) > 1 parte em 10^6."
    status: "TESTING"

  H5:
    nome: "Gravidade Efetiva a partir da Ação Espectral"
    descricao: "A expansão de Seeley-DeWitt Tr(f(D/Lambda)) reproduz os termos de Einstein-Hilbert e curvatura sem normalizações artificiais."
    predicao: "Coeficiente a_2 proporcional à curvatura escalar R."
    teste: "Análise assintótica de t -> 0 do Heat Kernel sem divisão por potências arbitrárias de 10."
    criterio_sucesso: "Convergência assintótica estrita para os coeficientes geométricos de heat kernel."
    criterio_falha: "Divergência dos coeficientes ou necessidade de fatores de escala de calibragem manual."
    status: "TESTING"

  H6:
    nome: "Previsões Fenomenológicas Fora da Amostra (Out-of-Sample)"
    descricao: "O modelo treinado em um conjunto de dados prevê observáveis em um conjunto de testes independente."
    predicao: "Parâmetros orbitais calibrados em planetas internos preveem planetas externos sem re-treinamento."
    teste: "Validação cruzada Training Set vs Test Set."
    criterio_sucesso: "Erro médio do Test Set comparável ao Training Set sem overfitting."
    criterio_falha: "Divergência expressiva do erro no Test Set."
    status: "TESTING"
